user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /var/www/html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # FFmpeg отправляет сюда локальный поток: rtmp://127.0.0.1/live/stream
            # Чтобы пушить в YouTube, раскомментируйте строку ниже и подставьте свой ключ.
            # Пример:
            # push rtmp://a.rtmp.youtube.com/live2/YOUR_STREAM_KEY;
        }
    }
}
